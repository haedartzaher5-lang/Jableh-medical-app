name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Android APK
        run: |
          mkdir -p www
          cp index.html www/
          echo '{"name": "jableh-medical-app", "version": "1.0.0"}' > package.json
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Jableh Medical" "com.jableh.medical" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jableh-Medical-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
