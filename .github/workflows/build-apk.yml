name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Cordova
        run: |
          npm install -g cordova
          cordova create app com.jableh.medical "JablehMedical"
          cp index.html app/www/index.html
          cd app
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jableh-Medical-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
