name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK with Logo
        run: |
          npm install -g cordova
          cordova create myapp com.jableh.medical "تطبيق جبلة الطبي"
          cp -f index.html myapp/www/index.html
          if [ -f logo.png ]; then
            cp -f logo.png myapp/logo.png
            sed -i 's|</widget>|  <icon src="logo.png" />\n</widget>|' myapp/config.xml
          fi
          cd myapp
          cordova platform add android@13.0.0
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jableh-Medical-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
