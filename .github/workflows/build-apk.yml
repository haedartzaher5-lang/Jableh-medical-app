name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK Clean Logo
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install -g cordova
          cordova create myapp com.jableh.medical "تطبيق جبلة الطبي"
          cp -f index.html myapp/www/index.html
          cd myapp
          cordova platform add android@13.0.0
          
          # مسح مجلد الأيقونات الافتراضية بالكامل لمنع أي تعارض أو تكرار
          rm -rf platforms/android/app/src/main/res/mipmap-*
          mkdir -p platforms/android/app/src/main/res/mipmap-hdpi
          
          LOGO_FILE=$(find .. -maxdepth 1 -iname "logo.*" | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            convert "$LOGO_FILE" -resize 192x192 platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
            convert "$LOGO_FILE" -resize 192x192 platforms/android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          fi
          
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Jableh-Medical.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jableh-Medical-APK
          path: Jableh-Medical.apk
